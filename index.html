<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドラム練習ログアプリ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }
        h1 {
            font-size: 1.2rem;
            color: #fff;
        }
        .date-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:active {
            background-color: #444;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .routine-item {
            margin-bottom: 14px;
            border-bottom: 1px dashed #333;
            padding-bottom: 12px;
        }
        .routine-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .routine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .routine-name {
            font-size: 0.95rem;
            color: #ddd;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: #4CAF50;
        }
        .bpm-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        .bpm-control input[type="number"] {
            width: 70px;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
            font-size: 1rem;
        }
        .bpm-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .rating-group {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .rating-btn {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            text-align: center;
        }
        .rating-btn.active {
            background: #388E3C;
            color: #fff;
            border-color: #4CAF50;
        }
        textarea {
            width: 100%;
            background: #121212;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-size: 0.9rem;
            resize: vertical;
            height: 50px;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .actions button {
            flex: 1;
            background-color: #2E7D32;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 6px;
        }
        .actions button.secondary {
            background-color: #333;
        }
        .history-list {
            margin-top: 20px;
        }
        .history-item {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-left: 3px solid #4CAF50;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">ドラム練習ログ</h1>
        <div class="date-nav">
            <button onclick="changeDate(-1)">◀ 前日</button>
            <span id="current-date-str" style="font-weight: bold; font-size: 0.9rem;"></span>
            <button onclick="changeDate(1)">翌日 ▶</button>
        </div>
    </header>

    <div class="card">
        <div class="card-title">
            <span id="theme-title">本日のメニュー</span>
            <span id="day-label" style="font-size: 0.8rem; color: #888;"></span>
        </div>
        
        <div id="routine-container">
            <!-- 動的に生成されます -->
        </div>
    </div>

    <div class="card">
        <div class="card-title">本日の自由メモ</div>
        <textarea id="daily-memo" placeholder="気づきやフォームの反省など..."></textarea>
    </div>

    <div class="actions">
        <button class="secondary" onclick="saveData()">一時保存</button>
        <button onclick="copyWeeklyData()">直近7日分をコピー（Gemini用）</button>
    </div>

    <div class="history-list" id="history-container">
        <!-- 過去ログ -->
    </div>

<script>
    const routinesByDay = {
        1: { name: "月曜日", theme: "Rudimental Ritual 集中【前半】", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (YouTube 0.8倍速)", type: "rating" },
            { id: "r4", name: "④ 月曜：Rudimental Ritual 前半 (60BPM)", type: "bpm" }
        ]},
        2: { name: "火曜日", theme: "メタリカ『One』＆ ヒール＆トゥ強化", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (YouTube 0.8倍速)", type: "rating" },
            { id: "r4", name: "④ 火曜：『One』3連符コンビネーション ＆ ヒール＆トゥ", type: "bpm" }
        ]},
        3: { name: "水曜日", theme: "実戦音源トレーニング【分析・部分攻略】", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (YouTube 0.8倍速)", type: "rating" },
            { id: "r4", name: "④ 水曜：実戦音源 部分攻略・実験", type: "rating" }
        ]},
        4: { name: "木曜日", theme: "Rudimental Ritual 集中【後半】", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (YouTube 0.8倍速)", type: "rating" },
            { id: "r4", name: "④ 木曜：Rudimental Ritual 後半 (60BPM)", type: "bpm" }
        ]},
        5: { name: "金曜日", theme: "実戦音源トレーニング【本番モード・通し】", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (YouTube 0.8倍速)", type: "rating" },
            { id: "r4", name: "④ 金曜：マイナスワン音源 1曲通し", type: "rating" }
        ]},
        6: { name: "土曜日", theme: "トータル・セッションおさらい", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (ロングセッション)", type: "rating" },
            { id: "r4", name: "④ 土曜：全体統合セッション", type: "rating" }
        ]},
        0: { name: "日曜日", theme: "トータル・セッションおさらい", items: [
            { id: "r1", name: "① 基礎パート (左足ツーバス/ヒール＆トゥ)", type: "bpm" },
            { id: "r2", name: "② Drumset Ritual", type: "bpm" },
            { id: "r3", name: "③ ブラシ練習 (ロングセッション)", type: "rating" },
            { id: "r4", name: "④ 日曜：全体統合セッション", type: "rating" }
        ]}
    };

    let currentDate = new Date();

    function formatDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function initApp() {
        renderUI();
        loadData();
        renderHistory();
    }

    function changeDate(days) {
        currentDate.setDate(currentDate.getDate() + days);
        renderUI();
        loadData();
    }

    function renderUI() {
        const dateStr = formatDateKey(currentDate);
        const dayOfWeek = currentDate.getDay();
        const routineInfo = routinesByDay[dayOfWeek];

        document.getElementById('current-date-str').innerText = `${dateStr} (${routineInfo.name.charAt(0)})`;
        document.getElementById('theme-title').innerText = routineInfo.theme;
        document.getElementById('day-label').innerText = routineInfo.name;

        const container = document.getElementById('routine-container');
        container.innerHTML = '';

        routineInfo.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'routine-item';
            
            let controlHTML = '';
            if (item.type === 'bpm') {
                controlHTML = `
                    <div class="bpm-control">
                        <button class="bpm-btn" onclick="adjustBpm('${item.id}', -1)">-</button>
                        <input type="number" id="${item.id}-bpm" placeholder="BPM" value="" inputmode="numeric">
                        <button class="bpm-btn" onclick="adjustBpm('${item.id}', 1)">+</button>
                        <span style="font-size:0.8rem; color:#888;">BPM</span>
                    </div>
                `;
            } else {
                controlHTML = `
                    <div class="rating-group" id="${item.id}-rating">
                        <button class="rating-btn" onclick="setRating('${item.id}', 1)">イマイチ</button>
                        <button class="rating-btn" onclick="setRating('${item.id}', 2)">普通</button>
                        <button class="rating-btn" onclick="setRating('${item.id}', 3)">最高</button>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="routine-header">
                    <span class="routine-name">${item.name}</span>
                    <label class="checkbox-label">
                        <input type="checkbox" id="${item.id}-done"> 完了
                    </label>
                </div>
                ${controlHTML}
            `;
            container.appendChild(div);
        });
    }

    function adjustBpm(id, delta) {
        const input = document.getElementById(`${id}-bpm`);
        let val = parseInt(input.value) || 70;
        val = Math.max(20, val + delta);
        input.value = val;
        saveData();
    }

    function setRating(id, level) {
        const group = document.getElementById(`${id}-rating`);
        const buttons = group.querySelectorAll('.rating-btn');
        buttons.forEach((btn, idx) => {
            if (idx + 1 === level) {
                btn.classList.add('active');
                btn.dataset.selected = "true";
            } else {
                btn.classList.remove('active');
                btn.dataset.selected = "false";
            }
        });
        saveData();
    }

    function getStorageKey() {
        return 'drum_log_' + formatDateKey(currentDate);
    }

    function saveData() {
        const key = getStorageKey();
        const dayOfWeek = currentDate.getDay();
        const routineInfo = routinesByDay[dayOfWeek];

        const data = {
            date: formatDateKey(currentDate),
            dayName: routineInfo.name,
            theme: routineInfo.theme,
            memo: document.getElementById('daily-memo').value,
            items: {}
        };

        routineInfo.items.forEach(item => {
            const done = document.getElementById(`${item.id}-done`).checked;
            let val = '';
            if (item.type === 'bpm') {
                val = document.getElementById(`${item.id}-bpm`).value;
            } else {
                const activeBtn = document.querySelector(`#${item.id}-rating .rating-btn.active`);
                val = activeBtn ? activeBtn.innerText : '';
            }
            data.items[item.id] = { name: item.name, done, val };
        });

        localStorage.setItem(key, JSON.stringify(data));
        renderHistory();
    }

    function loadData() {
        const key = getStorageKey();
        const raw = localStorage.getItem(key);
        
        // クリア
        const dayOfWeek = currentDate.getDay();
        const routineInfo = routinesByDay[dayOfWeek];
        routineInfo.items.forEach(item => {
            document.getElementById(`${item.id}-done`).checked = false;
            if (item.type === 'bpm') {
                document.getElementById(`${item.id}-bpm`).value = '';
            } else {
                document.querySelectorAll(`#${item.id}-rating .rating-btn`).forEach(b => {
                    b.classList.remove('active');
                    b.dataset.selected = "false";
                });
            }
        });
        document.getElementById('daily-memo').value = '';

        if (!raw) return;
        const data = JSON.parse(raw);
        document.getElementById('daily-memo').value = data.memo || '';

        for (const id in data.items) {
            const itemData = data.items[id];
            const chk = document.getElementById(`${id}-done`);
            if (chk) chk.checked = itemData.done;

            if (document.getElementById(`${id}-bpm`)) {
                document.getElementById(`${id}-bpm`).value = itemData.val;
            } else if (document.getElementById(`${id}-rating`)) {
                const buttons = document.querySelectorAll(`#${id}-rating .rating-btn`);
                buttons.forEach(btn => {
                    if (btn.innerText === itemData.val) {
                        btn.classList.add('active');
                    }
                });
            }
        }
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '<h3 style="font-size:0.9rem; margin-bottom:8px; color:#aaa;">保存済み履歴（直近）</h3>';
        
        let keys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k.startsWith('drum_log_')) keys.push(k);
        }
        keys.sort().reverse();

        keys.slice(0, 5).forEach(k => {
            const data = JSON.parse(localStorage.getItem(k));
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<strong>${data.date} (${data.dayName})</strong>: ${data.theme}`;
            container.appendChild(div);
        });
    }

    function copyWeeklyData() {
        let text = "【ドラム練習 直近7日間データ】\n\n";
        let d = new Date(currentDate);
        
        for (let i = 0; i < 7; i++) {
            const key = 'drum_log_' + formatDateKey(d);
            const raw = localStorage.getItem(key);
            if (raw) {
                const data = JSON.parse(raw);
                text += `■ ${data.date} (${data.dayName}) - ${data.theme}\n`;
                for (const id in data.items) {
                    const it = data.items[id];
                    text += `  - ${it.name}: ${it.done ? '完了' : '未'}, 記録: ${it.val || 'なし'}\n`;
                }
                if (data.memo) text += `  メモ: ${data.memo}\n`;
                text += `\n`;
            }
            d.setDate(d.getDate() - 1);
        }

        navigator.clipboard.writeText(text).then(() => {
            alert('直近7日間のデータをクリップボードにコピーしました！Geminiにそのまま貼り付けて分析をご依頼ください。');
        }).catch(err => {
            alert('コピーに失敗しました。ブラウザの権限をご確認ください。');
        });
    }

    window.onload = initApp;
</script>

</body>
</html>
